<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Meri Images</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
  }
  #status {
    text-align: center;
    margin-bottom: 20px;
    color: #aaa;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .grid .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s;
    display: block;
  }
  .grid .card img:hover {
    transform: scale(1.05);
  }
  #loadMoreBtn {
    display: block;
    margin: 30px auto;
    padding: 12px 24px;
    font-size: 16px;
    background: #4a4aff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #loadMoreBtn:hover {
    background: #6a6aff;
  }
  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 999;
  }
  #lightbox img {
    max-width: 90%;
    max-height: 90%;
  }
  #uploadBar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  #uploadBar input[type="file"] {
    color: #eee;
  }
  #uploadBtn {
    padding: 10px 20px;
    font-size: 15px;
    background: #2e8b57;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #uploadBtn:disabled {
    background: #555;
    cursor: not-allowed;
  }
  #uploadStatus {
    text-align: center;
    color: #aaa;
    margin-bottom: 10px;
    min-height: 18px;
  }
  .card {
    position: relative;
  }
</style>
</head>
<body>

<h1>Meri Images</h1>

<div id="uploadBar">
  <input type="file" id="fileInput" accept="image/*">
  <button id="uploadBtn">Upload karo</button>
</div>
<div id="uploadStatus"></div>

<div id="status">Loading...</div>
<div class="grid" id="grid"></div>
<button id="loadMoreBtn" style="display:none;">Aur images load karo</button>

<div id="lightbox">
  <img id="lightboxImg" src="">
</div>

<script>
const API_BASE = 'https://img-api-tlvo.onrender.com';
let nextCursor = null;
let totalLoaded = 0;

async function loadImages() {
  const statusEl = document.getElementById('status');
  const gridEl = document.getElementById('grid');
  const btn = document.getElementById('loadMoreBtn');

  statusEl.textContent = 'Loading...';
  btn.style.display = 'none';

  try {
    let url = API_BASE + '/images';
    if (nextCursor) url += '?next_cursor=' + encodeURIComponent(nextCursor);

    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      statusEl.textContent = 'Error: ' + data.error;
      return;
    }

    data.images.forEach(img => {
      const card = document.createElement('div');
      card.className = 'card';

      const imageEl = document.createElement('img');
      imageEl.src = img.url;
      imageEl.alt = img.id;
      imageEl.onclick = () => openLightbox(img.url);

      card.appendChild(imageEl);
      gridEl.appendChild(card);
    });

    totalLoaded += data.images.length;
    nextCursor = data.next_cursor;

    statusEl.textContent = totalLoaded + ' images loaded';

    if (nextCursor) {
      btn.style.display = 'block';
    }
  } catch (err) {
    statusEl.textContent = 'Connection error — check that the API server (npm start) is running.';
  }
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}

document.getElementById('lightbox').onclick = () => {
  document.getElementById('lightbox').style.display = 'none';
};

document.getElementById('loadMoreBtn').onclick = loadImages;

async function uploadImage() {
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadStatus = document.getElementById('uploadStatus');

  const file = fileInput.files[0];
  if (!file) {
    uploadStatus.textContent = 'Pehle ek image chuno.';
    return;
  }

  const formData = new FormData();
  formData.append('image', file);

  uploadBtn.disabled = true;
  uploadStatus.textContent = 'Upload ho raha hai...';

  try {
    const res = await fetch(API_BASE + '/images/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      uploadStatus.textContent = 'Error: ' + (data.error || 'Upload fail ho gaya');
      return;
    }

    uploadStatus.textContent = 'Upload ho gaya!';
    fileInput.value = '';

    // Refresh the gallery from scratch so the new image shows up
    document.getElementById('grid').innerHTML = '';
    nextCursor = null;
    totalLoaded = 0;
    await loadImages();
  } catch (err) {
    uploadStatus.textContent = 'Connection error — upload nahi ho paya.';
  } finally {
    uploadBtn.disabled = false;
  }
}

document.getElementById('uploadBtn').onclick = uploadImage;

loadImages();
</script>

</body>
</html>
